# Purpose: hooks that must pass before a commit is accepted.
#
# Install once per clone:  pre-commit install
# Run over everything:     pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]

  # 99 columns, the same limit ament_flake8 enforces in colcon test, so the
  # hook and the package test can never disagree.
  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.0
    hooks:
      - id: flake8
        args: [--max-line-length=99]

  - repo: local
    hooks:
      - id: proprietary-header
        name: proprietary licence header
        description: >
          Every source file must start with the proprietary header. Runs over
          the whole repository, so no file type can slip through, and calls
          the same script as test/test_header.py.
        entry: python3 scripts/check_headers.py
        language: system
        always_run: true
        pass_filenames: false
